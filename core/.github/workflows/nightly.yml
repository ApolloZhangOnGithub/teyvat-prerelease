name: nightly

on:
  schedule:
    - cron: '0 16 * * *'   # 北京时间凌晨0点 (UTC+8 → UTC 16:00)
  workflow_dispatch:        # 手动触发

permissions:
  contents: write

jobs:
  nightly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: build nightly message
        run: |
          TODAY=$(TZ=Asia/Shanghai date +%Y-%m-%d)
          {
            echo "$TODAY nightly"
            echo ""
            git log --since="$TODAY 00:00:00 +0800" --until="$TODAY 23:59:59 +0800" --format="- %s" 2>/dev/null || echo "(no commits today)"
          } > /tmp/nightly-msg.txt
          cat /tmp/nightly-msg.txt
      - name: nightly build
        run: make nightly MSG_FILE=/tmp/nightly-msg.txt
